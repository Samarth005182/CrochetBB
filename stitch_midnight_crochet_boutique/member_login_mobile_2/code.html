<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Luxe Craft - Member Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary": "#233148",
                      "surface-container-highest": "#2a344d",
                      "surface-container-low": "#101b33",
                      "surface-container-high": "#1f2942",
                      "on-surface-variant": "#c5c6cd",
                      "secondary": "#c8c6c3",

                      "inverse-primary": "#515f78",
                      "surface-container-lowest": "#030d25",
                      "error": "#ffb4ab",
                      "on-surface": "#d9e2ff",
                      "primary-fixed-dim": "#b9c7e4",
                      "tertiary-fixed-dim": "#b6c6ed",
                      "tertiary-container": "#061836",
                      "surface-variant": "#2a344d",
                      "on-secondary-fixed": "#1b1c1a",
                      "inverse-on-surface": "#263049",
                      "on-tertiary-fixed": "#091b39",
                      "background": "#08122a",
                      "on-tertiary-fixed-variant": "#374767",
                      "on-secondary-container": "#b6b5b1",
                      "secondary-fixed-dim": "#c8c6c3",
                      "on-background": "#d9e2ff",
                      "error-container": "#93000a",
                      "inverse-surface": "#d9e2ff",
                      "on-primary-fixed": "#0d1c32",
                      "outline-variant": "#44474d",
                      "on-secondary": "#30312e",
                      "surface-container": "#151f37",
                      "outline": "#8f9097",
                      "secondary-container": "#474744",
                      "primary": "#b9c7e4",
                      "primary-fixed": "#d6e3ff",
                      "on-error-container": "#ffdad6",
                      "secondary-fixed": "#e4e2de",
                      "on-primary-fixed-variant": "#39475f",
                      "surface": "#08122a",
                      "tertiary": "#b6c6ed",
                      "on-error": "#690005",
                      "on-tertiary-container": "#7282a5",
                      "surface-tint": "#b9c7e4",
                      "on-tertiary": "#20304f",
                      "on-primary-container": "#74829d",
                      "on-secondary-fixed-variant": "#474744",
                      "primary-container": "#0a192f",
                      "surface-bright": "#2f3952",
                      "surface-dim": "#08122a"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "section-gap": "120px",
                      "margin-desktop": "64px",
                      "container-max": "1280px",
                      "gutter": "24px",
                      "unit": "4px"
              },
              "fontFamily": {
                      "headline-lg": [
                              "Libre Caslon Text"
                      ],
                      "label-sm": [
                              "Hanken Grotesk"
                      ],
                      "label-lg": [
                              "Hanken Grotesk"
                      ],
                      "body-lg": [
                              "Hanken Grotesk"
                      ],
                      "display-lg": [
                              "Libre Caslon Text"
                      ],
                      "headline-md": [
                              "Libre Caslon Text"
                      ],
                      "headline-lg-mobile": [

                      ],

                      ]
              },
              "fontSize": {
                      "headline-lg": [

                      ],
                      "label-sm": [

                      ],
                      "label-lg": [
                              "14px",

                      ],

                      "display-lg": [

                      "body-md": [
                              "16px",
                              {

            }
          }
        }
      </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        /* Ghost Input Autofill Fix for Dark Mode */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px theme('colors.background') inset !important;
            -webkit-text-fill-color: theme('colors.on-background') !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .input-ghost {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(143, 144, 151, 0.2); /* outline-variant/20 */
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
            color: theme('colors.on-background');
            transition: all 0.3s ease;
        }
        
        .input-ghost:focus {
            box-shadow: none;
            border-bottom-color: theme('colors.on-surface');
            background-color: rgba(217, 226, 255, 0.03); /* subtle hover tint */
        }
      </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Ambient Background Lighting -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-container/30 blur-[100px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-surface-container-high/40 blur-[120px]"></div>
</div>
<!-- Header (Suppressed main nav logic applied, just logo for transactional screen) -->
<header class="w-full fixed top-0 z-50 py-6 px-margin-mobile flex justify-center items-center bg-background/80 backdrop-blur-md border-b border-outline-variant/10">
<h1 class="font-display-lg text-headline-md tracking-tighter text-on-background">LUXE CRAFT</h1>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center items-center px-margin-mobile pt-32 pb-16 z-10 w-full max-w-md mx-auto">
<div class="w-full mb-12 text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-4">Member Access</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">Sign in to view your bespoke creations, track orders, and explore exclusive drops.</p>
</div>
<form class="w-full flex flex-col gap-8">
<div class="flex flex-col relative group">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-1 transition-colors group-focus-within:text-primary" for="email">Email Address</label>
<input class="input-ghost font-body-lg text-body-lg h-12 w-full focus:ring-0" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
</div>
<div class="flex flex-col relative group">
<div class="flex justify-between items-end mb-1">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest transition-colors group-focus-within:text-primary" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-background transition-colors underline decoration-1 underline-offset-4" href="#">Forgot?</a>
</div>
<input class="input-ghost font-body-lg text-body-lg h-12 w-full focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex items-center mt-2 mb-6">
<div class="relative flex items-center">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded-DEFAULT border border-outline-variant bg-transparent checked:border-on-surface checked:bg-on-surface focus:outline-none focus:ring-0 focus:ring-offset-0 transition-all" id="remember" type="checkbox"/>
<span class="material-symbols-outlined absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-background opacity-0 peer-checked:opacity-100 pointer-events-none" style="font-size: 16px; font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="ml-3 font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Stay signed in</label>
</div>
<div class="flex flex-col gap-4 mt-4">
<button class="w-full bg-on-surface text-background font-label-lg text-label-lg uppercase tracking-widest py-4 rounded-DEFAULT transition-all active:bg-primary hover:opacity-90" type="submit">
                    Sign In
                </button>
<button class="w-full bg-transparent border border-on-surface text-on-surface font-label-lg text-label-lg uppercase tracking-widest py-4 rounded-DEFAULT transition-all active:bg-surface-container-high hover:bg-surface-bright/10" type="button">
                    Create Account
                </button>
</div>
</form>
</main>
<!-- Footer (Minimal version for transactional screen) -->
<footer class="w-full py-8 border-t border-outline-variant/5 bg-surface-container-lowest mt-auto z-10">
<div class="flex flex-col items-center gap-4 px-margin-mobile">
<span class="font-label-sm text-label-sm text-on-surface-variant text-center opacity-80 uppercase tracking-widest">
                © 2024 LUXE CRAFT ATELIER. ALL RIGHTS RESERVED.
            </span>
</div>
</footer>
</body></html>

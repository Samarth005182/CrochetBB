<!DOCTYPE html>

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .ghost-input {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid theme('colors.outline-variant');
            border-radius: 0;
            color: theme('colors.on-background');
            padding-left: 0;
            padding-right: 0;
            box-shadow: none !important;
            transition: border-color 0.3s ease;
        }
        
        .ghost-input:focus {
            border-bottom-color: theme('colors.on-background');
            outline: none;
            box-shadow: none !important;
        }
        
        .ghost-input::placeholder {
            color: theme('colors.on-surface-variant');
            opacity: 0.7;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopNavBar Suppressed as per Intent (Linear/Transactional: Login) -->
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center py-section-gap px-margin-mobile md:px-margin-desktop">
<div class="w-full max-w-lg">
<!-- Brand Anchor Header -->
<div class="text-center mb-16">
<a class="inline-block font-display-lg text-headline-md tracking-tighter text-on-background hover:opacity-80 transition-opacity" href="#">
                    LUXE CRAFT
                </a>
<p class="font-body-md text-body-md text-on-surface-variant mt-4">
                    Enter the atelier.
                </p>
</div>
<!-- Login/Registration Form Area -->
<div class="bg-surface-container-low p-8 md:p-12 border border-outline-variant/10 rounded">
<h1 class="font-headline-md text-headline-md text-on-background mb-8">Sign In</h1>
<form action="#" class="space-y-8" method="POST">
<div class="space-y-2 relative group">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest block transition-colors group-focus-within:text-on-background" for="email">Email Address</label>
<div class="relative">
<input class="w-full ghost-input font-body-md text-body-md py-2" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
</div>
</div>
<div class="space-y-2 relative group">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest block transition-colors group-focus-within:text-on-background" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-background transition-colors uppercase tracking-widest" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full ghost-input font-body-md text-body-md py-2" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-background transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<div class="pt-4 space-y-4">
<button class="w-full bg-on-background text-background font-label-lg text-label-lg uppercase tracking-widest py-4 hover:bg-surface-tint hover:text-on-primary transition-colors duration-300" type="submit">
                            Sign In
                        </button>
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline-variant/20"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/20"></div>
</div>
<button class="w-full bg-transparent border border-on-background text-on-background font-label-lg text-label-lg uppercase tracking-widest py-4 flex items-center justify-center gap-2 hover:bg-on-background/5 transition-colors duration-300" type="button">
                           Continue as Guest
                        </button>
</div>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        New to Luxe Craft? 
                        <a class="text-on-background hover:text-primary transition-colors border-b border-on-background/30 hover:border-primary pb-0.5 ml-1" href="#">Create an Account</a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer Suppressed on Transactional Screens -->
</body></html>
